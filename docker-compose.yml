services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: docker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /app/local_cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/local_cache/sentence_transformers
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      DATA_PATH: /app/data/colleges.json
      FAQ_DATA_PATH: /app/data/faq_admission.json
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      BOOTSTRAP_INGEST: ${BOOTSTRAP_INGEST:-auto}
      APP_ENTRYPOINT: ${APP_ENTRYPOINT:-telegram}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_logs:/app/logs
      - model_cache:/app/local_cache
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uvicorn app.interfaces.api:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: docker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /app/local_cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/local_cache/sentence_transformers
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      DATA_PATH: /app/data/colleges.json
      FAQ_DATA_PATH: /app/data/faq_admission.json
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_logs:/app/logs
      - model_cache:/app/local_cache
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mosobr_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
  model_cache:
